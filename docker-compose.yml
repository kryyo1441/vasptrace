# Self-hosted n8n — orchestration-visibility layer (SIH plan item 6). This
# is intentionally NOT in the critical path of tracing: VASPtrace works fully
# without it (N8N_*_WEBHOOK_URL unset just skips the fire-and-forget notify).
# Its job during a demo is to make the pipeline's hops visible on n8n's
# canvas while the real work happens in Next.js API routes. See
# docs/ARCHITECTURE.md.
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    extra_hosts:
      # Lets the two workflows' HTTP Request nodes reach the Next.js dev
      # server on the host. Docker Desktop (Mac/Windows) maps this
      # automatically; Linux needs it spelled out.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
